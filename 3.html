<!DOCTYPE html>

<body>
  <!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประกันสุขภาพ</title>
  <style>

    .Service-container{
      width: 90%;
      max-width: 800px;
      margin: 20px auto;
      position: relative;

    }

    .card-Service {
      display: flex;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .card-Service img {
      width: 350px;
      object-fit: cover;
    }

    .card-content-Service {
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .card-content-Service h3 {
      margin: 0;
      color: #002d71;
    }

    .card-content-Service p {
      color: #555;
      margin: 10px 0;
    }

    .card-buttons-Service {
      margin-top: auto;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .card-buttons-Service a {
      color: #002d71;
      text-decoration: none;
      font-weight: bold;
    }

    .btn {
      padding: 10px 20px;
      background: #002d71;
      color: white;
      border-radius: 20px;
      text-decoration: none;
    }

    @media screen and (max-width: 768px) {
      .card-Service {
        flex-direction: column;
      }

      .card-Service img {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    .underline-container {
      text-align: center; /* จัดภาพให้อยู่กลาง */
    }

    .underline {
      width: 100%;         /* หรือกำหนดความกว้างตามต้องการ เช่น 50% */
      height: 2px;         /* ความหนาเส้น */
      background: #8697C4; /* สีของเส้น */
      margin: 10px auto;   /* ระยะห่างจากภาพ และจัดกึ่งกลาง */
    }
  </style>
</head>
<body>

  <div class="underline-container">
    <div class="underline"></div>
  </div>

</body>
</html>
