<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สมัครตัวแทนประกันชีวิต</title>
</head>
<body>

<div class="Scrolling_Text">
  <div class="text_group">
    <p class="tg">Lorem ipsum, dolor sit amet consectetur adipisicing.</p>
  </div>
</div>

<style>
  .text_group {
    position: relative;
    height: 30px;
    overflow: hidden;
    color: #000;
    background-color: #c3c3c3;
    border-bottom: 2px solid #004aad;
    border-top: 2px solid #004aad;
  }

  .tg {
    position: absolute;
    margin: 5px 0;
    padding: 0;
    width: max-content;
  }
</style>

<script>
  const styli = document.createElement('style');
  const position = 'right';
  const tgElement = document.querySelector('.tg');

  styli.innerHTML = `
    @keyframes my-animation {
      0% { ${position}: -${tgElement.offsetWidth + 10}px; }
      100% { ${position}: 100%; }
    }
    .tg {
      animation: my-animation 24s linear infinite;
    }
  `;

  document.head.append(styli);
</script>


</body>
</html>
